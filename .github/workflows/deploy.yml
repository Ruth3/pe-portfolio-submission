name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      TESTING: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Setup Python Virtual Environment
        run: python -m venv python3-virtualenv

      - name: Install Dependencies
        run: python3-virtualenv/bin/pip install -r requirements.txt

      - name: Run Tests
        run: |
          source python3-virtualenv/bin/activate
          ./run_test.sh

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          cat >> ~/.ssh/config <<END
          Host my-vps
            HostName ${{ secrets.SSH_IP }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy-key.pem
            StrictHostKeyChecking no
          END

      - name: Deploy site
        run: ssh my-vps '~/redeploy-site.sh'

      - name: Print container status
        run: ssh my-vps 'cd "${{ secrets.PROJECT_ROOT }}" && docker compose ps'

      - name: Discord deployment success
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -d "content=🚀  Deployment Successful"

  notify-failure:
    name: Notify Deployment Failure
    runs-on: ubuntu-latest
    needs:
      - test
      - deploy
    if: ${{ always() && (needs.test.result == 'failure' || needs.deploy.result == 'failure') }}

    steps:
      - name: Discord deployment failure
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -d "content=🚨 Deployment Failed"
